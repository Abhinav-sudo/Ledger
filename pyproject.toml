[project]
name = "ledger"
version = "0.1.0"
description = "Multi-agent accounts-payable exception handling with exactly-once payments"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.48.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "reportlab",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "hypothesis",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
